name: Zonemgr CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.24

    - name: Tidy
      run: go mod tidy

    - name: Test
      run: 	go test ./... -cover -coverprofile=coverage.out

    - name: Coverage
      run: go tool cover -func coverage.out
      
    - name: Build
      run: go build -o bin/${zonemgr}
